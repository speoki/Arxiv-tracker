categories: ["physics.soc-ph","math.AT","math.GT","math.KT","stat.ML","stat.TH", "cs.CG", "cs.LG"]
keywords:
  - "simplicial complex"
  - "hypergraph"
  - "high-order network"
  - "topological data analysis"
  - "topology data analysis"
  - "diffusion model"
  - "persistent homology"
  - "TDA"
  - "time-series anomaly detection"
  - "perslay"
  - "information decomposition"
  - "o-information"
  - "high-order interaction"

# exclude_keywords: # 选择排除的关键词
#   - "Large Language Model"
#   - "LLM"
  
logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR
max_results: 30
sort_by: "lastUpdatedDate"  # 还可以是submittedDate 建议改成lastUpdatedDate按更新时间排，能捞到v2/v3的“新增”
sort_order: "descending"

# zh / en / both
lang: "both"

# —— 摘要设置 ——
# mode: none / heuristic / llm
summary:
  mode: llm # mode: "heuristic"
  # scope: tldr / full / both
  scope: "both"

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple / full
  max_items: 30
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— LLM（DeepSeek/OpenAI 兼容） ——
llm:
  provider: "openai-compatible"     # 兼容 OpenAI SDK 的服务
  # 硅基流动的版本
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  api_key_env: "OPENAI_COMPAT_API_KEY"
  # Deepseek的版本
  # base_url: "https://api.deepseek.com"
  # model: "deepseek-chat"
  # api_key_env: "DS_API_KEY"
  

  system_prompt_en: |
    You are an experienced academic paper-reading assistant. Given the paper metadata and abstract,
    write exactly ONE concise paragraph in English. The paragraph must objectively summarize:
    (1) the research motivation or problem setting,
    (2) the core method or technical approach,
    and (3) the main experimental results or empirical findings.
    Be specific and faithful to the provided information. Do not add unsupported claims, hype, or marketing language.
    Use precise academic terminology. If links are provided in the input, preserve them elsewhere in the output format if needed,
    but do not repeat or mention the links inside the summary paragraph.
  system_prompt_zh: |
    你是资深学术论文阅读助手。请基于给定的论文元信息与摘要，用中文写「严格一段」简洁总结。
    总结必须客观覆盖：
    （1）研究动机或问题背景，
    （2）核心方法或技术路线，
    （3）主要实验结果或实证发现。
    请忠实依据输入内容，不补充未提供的信息，不使用夸张或营销式表述。
    保持术语准确、表达凝练。如输入中包含链接，可在需要时保留在输出的其他字段中，
    但不要在总结段落中重复或提及链接。

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true         # 是否启用
  lang: "zh"            # 目前只需中文；也可扩展 en/ja 等
  fields: ["title", "summary"]   # 可扩：["title","summary","comments"]

site:
  enabled: true
  dir: "docs" 
  title: "arXiv 论文速递"
  keep_runs: 1024         # 历史保留期（按页面份数）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 3650           # 只看最近 N 天内新提交/更新（1=近24h）
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"  # 去重状态文件（会随 docs 一起提交保存）
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想“不管有没有都扫 PDF”，设 true）
  timeout: 10
